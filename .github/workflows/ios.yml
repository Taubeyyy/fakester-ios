# Baut die iOS-App auf einem Mac-Runner und legt eine TrollStore-fertige .ipa
# als GitHub-Release ab (Tag build-<Nummer>). Signiert wird nur per ldid mit
# Entitlements - TrollStore uebernimmt den Rest beim Installieren.
name: iOS build

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      fotos:
        description: 'Nur Bildschirmfotos aus dem Simulator (kein Release)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write      # GitHub-OIDC: damit sich der Build beim Server melden kann, ohne Geheimnis

jobs:
  build:
    if: ${{ !inputs.fotos }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Build-Nummer (neues Repo seit 2026-10-04 → Lauf + 100, damit alte Installationen das Update erkennen)
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Werkzeuge
        run: brew install xcodegen ldid

      # Laeuft VOR dem Xcode-Schritt: alles, was ohne Bildschirm pruefbar ist,
      # soll scheitern, bevor zehn Minuten Buildzeit verbrannt sind. Vor allem
      # das Dekodieren der Server-Nachrichten - daran stirbt ein Client sonst
      # erst auf dem Geraet, mitten in einer Runde.
      - name: Logik-Tests (Protokoll)
        run: |
          set -o pipefail
          { swiftc -O Shared/*.swift Tests/Capture.swift Tests/main.swift -o /tmp/logic && /tmp/logic; } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild -project Fakester.xcodeproj -scheme Fakester \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=0.1.${{ env.BUILD }} \
            CURRENT_PROJECT_VERSION=${{ env.BUILD }} \
            build 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Mit ldid signieren + IPA packen
        run: |
          APP=build/Build/Products/Release-iphoneos/Fakester.app
          # -I setzt die Signatur-ID auf die Bundle-ID; ohne das nimmt ldid den
          # Dateinamen, und manche iOS-Dienste pruefen die ID.
          ldid -SFakester/Fakester.entitlements -Icom.taubey.fakester "$APP/Fakester"
          ldid -e "$APP/Fakester"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Fakester.ipa Payload)
          ls -lh out/Fakester.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Fakester-${{ env.BUILD }}
          path: ios/out/Fakester.ipa

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ env.BUILD }}" out/Fakester.ipa \
            --title "Fakester Build ${{ env.BUILD }}" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"

      # Ergebnis an den Server (Claude-App zeigt den Build-Stand, Claude auf dem Server liest Fehler).
      - name: Build-Stand an den Server melden
        if: always()
        env:
          OK: ${{ job.status == 'success' && '1' || '0' }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dopa-hub" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin).get("value", ""))') || exit 0
          [ -z "$TOKEN" ] && exit 0
          NOTES=$(git log -1 --pretty=%s | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip()[:200]))')
          { echo "Build ${{ env.BUILD }} – Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"; echo;
            grep -E "error:|✗|FAIL|\*\* BUILD FAILED" "$RUNNER_TEMP/build.log" | head -150; echo; echo "--- Ende des Protokolls ---";
            tail -120 "$RUNNER_TEMP/build.log"; } > "$RUNNER_TEMP/ci.txt" 2>/dev/null || true
          curl -fsS -X PUT "https://dopa.taubey.com/api/hub/ci/fakester?run=${{ env.BUILD }}&job=build&ok=$OK" \
            -H "Authorization: Bearer $TOKEN" -H "X-Release-Notes: $NOTES" -H "Content-Type: text/plain" \
            --data-binary @"$RUNNER_TEMP/ci.txt" || true

  # Bildschirmfotos der App aus dem iOS-Simulator - zum Nebeneinanderlegen mit
  # fakester.app. Baut Debug (dort gibt es den Vorschau-Modus aus
  # ios/Fakester/Screenshots.swift), startet jede Szene einzeln und knipst sie.
  # Nur von Hand (fotos: true), legt KEIN Release an.
  fotos:
    if: ${{ inputs.fotos }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      # 375 x 812 Punkte wie die Webseiten-Aufnahmen - das ist ein iPhone 13 mini.
      - name: Simulator
        run: |
          set -e
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import sys, json; r = [x for x in json.load(sys.stdin)["runtimes"] if x["platform"] == "iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
          DT=com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini
          xcrun simctl list devicetypes | grep -q "iPhone 13 mini" || DT=com.apple.CoreSimulator.SimDeviceType.iPhone-16
          echo "Laufzeit $RT, Geraet $DT"
          UDID=$(xcrun simctl create Foto "$DT" "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Bauen (Debug, Simulator)
        run: |
          set +e
          xcodebuild -project Fakester.xcodeproj -scheme Fakester \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=9999 MARKETING_VERSION=0.1.9999 \
            build > "$RUNNER_TEMP/bau.log" 2>&1
          STATUS=$?
          grep -E "error:|\*\* BUILD" "$RUNNER_TEMP/bau.log" | head -100 || true
          exit $STATUS

      - name: Knipsen
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Fakester.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p fotos
          GAST="-gast.id guest-1791131740573-ope1d -gast.name Gast9694"
          for S in anmeldung daheim beitreten gastsperre erstellen rangliste lobby runde gewaehlt eingeloggt aufloesung ende; do
            xcrun simctl terminate "$UDID" com.taubey.fakester 2>/dev/null || true
            if [ "$S" = anmeldung ]; then A=""; else A="$GAST"; fi
            xcrun simctl launch "$UDID" com.taubey.fakester -vorschau "$S" $A
            sleep 7
            xcrun simctl io "$UDID" screenshot "fotos/$S.png"
          done
          ls -l fotos

      - uses: actions/upload-artifact@v4
        with:
          name: fotos
          path: ios/fotos
