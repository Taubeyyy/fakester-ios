# Builds the iOS app on a Mac runner and publishes a TrollStore-ready .ipa as a
# GitHub release (tag build-<number>). Signed only with ldid and entitlements -
# TrollStore does the rest when installing.
name: iOS build

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Only simulator screenshots and the end-to-end test (no release)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write      # GitHub OIDC: lets the build report to the server without a secret

jobs:
  build:
    if: ${{ !inputs.screenshots }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Build number (new repo since 2026-10-04 → run + 100, so old installs recognise the update)
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Tools
        run: brew install xcodegen ldid

      # Runs BEFORE the Xcode step: everything testable without a screen should
      # fail before ten minutes of build time are burnt. Above all decoding the
      # server messages - otherwise a client only dies on the device, mid-round.
      - name: Logic tests (protocol)
        run: |
          set -o pipefail
          { swiftc -O Shared/*.swift Tests/*.swift -o /tmp/logic && /tmp/logic; } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Fakester.xcodeproj -scheme Fakester \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=0.1.${{ env.BUILD }} \
            CURRENT_PROJECT_VERSION=${{ env.BUILD }} \
            build 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Sign with ldid + pack the IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Fakester.app
          # -I sets the signing ID to the bundle ID; without it ldid uses the
          # file name, and some iOS services check the ID.
          ldid -SFakester/Fakester.entitlements -Icom.taubey.fakester "$APP/Fakester"
          ldid -e "$APP/Fakester"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Fakester.ipa Payload)
          ls -lh out/Fakester.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Fakester-${{ env.BUILD }}
          path: ios/out/Fakester.ipa

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ env.BUILD }}" out/Fakester.ipa \
            --title "Fakester Build ${{ env.BUILD }}" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"

      # Result to the server (the Claude app shows the build state, Claude on the server reads errors).
      - name: Report the build state to the server
        if: always()
        env:
          OK: ${{ job.status == 'success' && '1' || '0' }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dopa-hub" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin).get("value", ""))') || exit 0
          [ -z "$TOKEN" ] && exit 0
          NOTES=$(git log -1 --pretty=%s | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip()[:200]))')
          { echo "Build ${{ env.BUILD }} – Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"; echo;
            grep -E "error:|✗|FAIL|\*\* BUILD FAILED" "$RUNNER_TEMP/build.log" | head -150; echo; echo "--- Ende des Protokolls ---";
            tail -120 "$RUNNER_TEMP/build.log"; } > "$RUNNER_TEMP/ci.txt" 2>/dev/null || true
          curl -fsS -X PUT "https://dopa.taubey.com/api/hub/ci/fakester?run=${{ env.BUILD }}&job=build&ok=$OK" \
            -H "Authorization: Bearer $TOKEN" -H "X-Release-Notes: $NOTES" -H "Content-Type: text/plain" \
            --data-binary @"$RUNNER_TEMP/ci.txt" || true

  # Screenshots of the app from the iOS simulator - to put next to fakester.app.
  # Builds Debug (which has the screenshot scenes from
  # ios/Fakester/Screenshots.swift), launches each scene and captures it, then
  # runs the end-to-end test. Manual only (screenshots: true), NO release.
  screenshots:
    if: ${{ inputs.screenshots }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # 375 x 812 points like the website captures - that is an iPhone 13 mini.
      - name: Simulator
        run: |
          set -e
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import sys, json; r = [x for x in json.load(sys.stdin)["runtimes"] if x["platform"] == "iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
          DT=com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini
          xcrun simctl list devicetypes | grep -q "iPhone 13 mini" || DT=com.apple.CoreSimulator.SimDeviceType.iPhone-16
          echo "Runtime $RT, device $DT"
          UDID=$(xcrun simctl create Shots "$DT" "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Build (Debug, simulator)
        run: |
          set +e
          xcodebuild -project Fakester.xcodeproj -scheme Fakester \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=9999 MARKETING_VERSION=0.1.9999 \
            build > "$RUNNER_TEMP/bau.log" 2>&1
          STATUS=$?
          grep -E "error:|\*\* BUILD" "$RUNNER_TEMP/bau.log" | head -100 || true
          exit $STATUS

      - name: Capture scenes
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Fakester.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          GAST="-gast.id guest-1791131740573-ope1d -gast.name Gast9694"
          for S in login home join guest-notice create leaderboard stats settings shop style path quests awards friends playlists lobby round picked locked-in reveal game-over; do
            xcrun simctl terminate "$UDID" com.taubey.fakester 2>/dev/null || true
            if [ "$S" = login ]; then A=""; else A="$GAST"; fi
            xcrun simctl launch "$UDID" com.taubey.fakester -scene "$S" $A
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$S.png"
          done
          ls -l shots

      # Plays one full game as a guest against the live server by tapping
      # through the app (UITests/SmokeTests.swift); screenshots go to e2e/.
      - name: End-to-end test
        run: |
          set +e
          xcodebuild test -project Fakester.xcodeproj -scheme Fakester \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/e2e.xcresult" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=9999 MARKETING_VERSION=0.1.9999 \
            > "$RUNNER_TEMP/test.log" 2>&1
          STATUS=$?
          grep -E "error:|Test Case|Executed|FAIL|XCTAssert|Did not appear" "$RUNNER_TEMP/test.log" | tail -60
          mkdir -p shots/e2e
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/e2e.xcresult" --output-path shots/e2e || true
          ls shots/e2e | head -60
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ios/shots
